server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头。HSTS 不在此设：TLS 由宿主反代/Cloudflare 边缘终结，容器内是纯 HTTP；
    # CSP 也不设：需放行主题防闪烁内联脚本（unsafe-inline），对纯静态站收益低于维护成本。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 压缩：官方镜像默认关闭（stock 配置里是 #gzip on;），必须显式开启。
    # html 开启 gzip 后默认参与压缩；woff2 字体本身已压缩，不列入 types。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 带内容 hash 的构建产物（含自托管字体），可长期强缓存。
    # 单条 Cache-Control 写全（不与 expires 混用，避免发出两个 Cache-Control 头）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header 不叠加继承：本 location 有了自己的 add_header 后，
        # server 级的安全头对此路径即全部失效，必须在此重复一份
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # 全站路由均已 SSG 预渲染成文件（dirStyle: nested），未命中即真 404，
    # 不再兜底 index.html 返回 200（软 404 对 SEO 不友好）；
    # 404 页面用预渲染的 /404/index.html，状态码保持 404
    error_page 404 /404/index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
