server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 压缩：官方镜像默认关闭（stock 配置里是 #gzip on;），必须显式开启。
    # html 开启 gzip 后默认参与压缩；woff2 字体本身已压缩，不列入 types。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 带内容 hash 的构建产物（含自托管字体），可长期强缓存。
    # 单条 Cache-Control 写全（不与 expires 混用，避免发出两个 Cache-Control 头）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history 模式：未命中的路径回退到 index.html，交给 Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
