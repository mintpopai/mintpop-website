<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 防闪烁:首屏 paint 前按记忆/系统偏好定 data-theme,与 useTheme 的键值保持一致 -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('mint-theme')
          var theme =
            saved === 'LIGHT' || saved === 'DARK'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'DARK'
                : 'LIGHT'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          /* 隐私模式/禁用存储时 localStorage 访问会抛错，静默回退到无记忆的默认主题即可 */
        }
      })()
    </script>
    <!-- 站点图标:MintPop 标记(cloud 浅底瓦片);iOS 主屏用专门的白底圆角版(透明底会被 iOS 垫黑) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- title/description 由各页 useHead 动态接管;此处保留首页文案作无 JS 兜底 -->
    <title>MintPop — One API for text, vision, and voice</title>
    <meta
      name="description"
      content="MintPop — multimodal AI infrastructure for developers. Build text, vision, and voice into your product through a single, unified endpoint."
    />
    <!-- 字体（Newsreader 标题衬线、Space Grotesk 正文）经 Fontsource 自托管,
         在 main.ts 里 import、随构建产物同源分发;不外链 Google Fonts(大陆被阻断会整页白屏) -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
